const LEVEL_ORDER = { none: 0, mild: 1, moderate: 2, severe: 3 };
const LEVEL_LABELS = { none: "Not immunocompromised", mild: "Mild", moderate: "Moderate", severe: "Severe" };
const LEVEL_COLORS = { none: "#64748b", mild: "#2563eb", moderate: "#d97706", severe: "#dc2626" };

function resetAll() {

// ═══════════════════════════════════════════════════════════════════════════════
// VACCINE LOGIC
// ═══════════════════════════════════════════════════════════════════════════════
function calcLevel() {
  const d = [];
  let mx = "none";
  for (const cat of Object.values(THERAPY_CATEGORIES))
    for (const [k, th] of Object.entries(cat.therapies))
      if (state.therapies.includes(k)) { d.push({ ...th, id: k }); if (LEVEL_ORDER[th.level] > LEVEL_ORDER[mx]) mx = th.level; }
  const isC = d.filter(x => LEVEL_ORDER[x.level] >= 1).length;
  const modC = d.filter(x => x.level === "moderate").length;
  let esc = mx, combo = null;
  if (isC >= 2 && mx !== "severe") {
    if (modC >= 2) { esc = "severe"; combo = "Multiple moderate-risk agents \u2014 consider managing as SEVERE."; }
    else { if (mx === "mild") esc = "moderate"; if (mx === "moderate") esc = "severe"; combo = `${isC} immunosuppressive agents \u2014 escalated to ${LEVEL_LABELS[esc]}.`; }
  }
  return { level: esc, indiv: d.map(x => ({ name: x.label, level: x.level })), combo, details: d };
}

function getVaccines(level, age, atsi, therapies, known) {
  const has = t => therapies.includes(t);
  const kn = v => known.includes(v);
  // Aggregate per-vaccine flags across selected therapies/conditions
  const selected = [];
  for (const cat of Object.values(THERAPY_CATEGORIES))
    for (const [k, th] of Object.entries(cat.therapies))
      if (therapies.includes(k)) selected.push({ ...th, id: k });
  const anyFlag = f => selected.some(t => t[f]);
  const notesFor = f => selected.filter(t => t[f]).map(t => t[f]);
  const pneumoFundedFlag = anyFlag("pneumoFunded");
  const zosterFundedFlag = anyFlag("zosterFunded");
  const covidSevereFlag = anyFlag("covidSevere");
  const covidNotes = notesFor("covidNote");
  const pneumoNotes = notesFor("pneumoNote");
  const needsE = has("asplenia") || has("complementDeficiency") || has("eculizumab");
  const hasHIV = therapies.some(t => t.startsWith("hiv"));
  const hasHSCT = has("hsct"); const hasSOT = has("sot"); const hasHM = has("haemMalignActive");
  const modSev = LEVEL_ORDER[level] >= 2;
  const V = [];

  V.push({ name: "Influenza (IIV)", type: "Non-live", schedule: "Annual \u2014 IIV only", ci: false, nip: true, nipNote: "Funded for IC conditions", notes: modSev ? "LAIV contraindicated." : "Prefer IIV.", priority: "essential", status: kn("influenza") ? "done" : "due", statusNote: kn("influenza") ? "Received this season" : "Due \u2014 annual" });

  const sNIP = zosterFundedFlag;
  const s2 = kn("shingrix2"), s1 = kn("shingrix1");
  V.push({ name: "Shingrix", type: "Non-live", schedule: modSev ? "2 doses, 1\u20132mo apart" : "2 doses, 2\u20136mo apart", ci: false, nip: sNIP, nipNote: sNIP ? "NIP-funded \u2014 qualifying moderate/severe IC condition or therapy (\u226518yo)" : "Recommended for all IC \u226518yo; private script if not a funded condition/therapy", notes: "Non-live recombinant adjuvanted. Safe on IS.", priority: modSev ? "essential" : "recommended", status: s2 ? "done" : s1 ? "partial" : "due", statusNote: s2 ? "Course complete" : s1 ? "Dose 1 done \u2014 dose 2 due" : "Not started" });

  // Pneumococcal — 1 July 2026 NIP program: single dose of 21vPCV (Capvaxive) for adults ≥18 with a
  // risk condition. No PCV→PPV sequencing, no 23vPPV. Funding is CONDITION-driven (not severity-gated):
  // funded conditions = asplenia, IEI, haem malignancy, SOT, HSCT, HIV, previous IPD, CSF leak/cochlear,
  // eGFR<15/dialysis. Immunosuppressive therapy alone (reconstitution expected) and non-haem malignancy on
  // chemo are recommended-but-NOT-funded. Any prior pneumococcal vaccine → 21vPCV ≥12mo after last dose.
  const pNIPfunded = pneumoFundedFlag || needsE; // needsE = asplenia/complement/eculizumab → asplenia funds
  const pRecommended = LEVEL_ORDER[level] >= 1 || therapies.length > 0;
  const hadAnyPneumo = kn("pcv_any") || kn("ppv_any") || kn("p21vpcv");
  const had21 = kn("p21vpcv");
  let pSt = "due", pN = "Give single dose 21vPCV (Capvaxive)";
  if (had21) { pSt = "done"; pN = "21vPCV received \u2014 schedule complete (further doses not yet established)"; }
  else if (hadAnyPneumo) { pSt = "partial"; pN = "Prior pneumococcal vaccine \u2014 give 1 dose 21vPCV \u226512mo after last dose (NIP-funded regardless of timing)"; }
  let pNote = needsE ? "HIGH PRIORITY \u2014 encapsulated organism risk" : "Single 21vPCV dose. Check prior hx on AIR.";
  if (pneumoNotes.length) pNote += " " + pneumoNotes.join(" ");
  V.push({ name: "Pneumococcal (21vPCV)", type: "Non-live", schedule: "Single dose 21vPCV (Capvaxive). No 23vPPV. Prior dose \u2192 21vPCV \u226512mo after.", ci: false, nip: pNIPfunded, nipNote: pNIPfunded ? "NIP-funded \u2014 qualifying risk condition (\u226518yo). Single 21vPCV dose." : "Recommended but NOT NIP-funded \u2014 immunosuppressive therapy alone (with expected reconstitution) is not a funded condition. Private script for 21vPCV.", notes: pNote, priority: "essential", status: pSt, statusNote: pN });

  const hbD = kn("hepB_complete"), hbNR = kn("hepB_nonresponder");
  V.push({ name: "Hepatitis B", type: "Non-live", schedule: "3-dose (0, 2, 6mo). Double-dose if NR.", ci: false, nip: false, nipNote: "State funding for some risk groups (ATSI, contacts, PWID)", notes: "Screen HBsAg, anti-HBc, anti-HBs. If HBsAg+ \u2192 antiviral Mx.", priority: "essential", status: hbD ? "done" : hbNR ? "action" : "due", statusNote: hbD ? "Immune (anti-HBs \u226510)" : hbNR ? "Non-responder \u2014 revaccinate (double-dose/4-dose)" : "Check serology" });

  V.push({ name: "dTpa", type: "Non-live", schedule: "10-yearly booster", ci: false, nip: false, nipNote: "NIP in pregnancy (20\u201332wk) only", notes: "No IC modification", priority: "routine", status: kn("dtpa") ? "done" : "due", statusNote: kn("dtpa") ? "Within last 10yr" : "Check last dose" });

  // COVID-19 — severe IC (per COVID table) → 2 primary doses + consider 3rd, then further doses every
  // 12mo (consider 6-monthly). Standard adult → single primary dose, consider 12-monthly.
  // Anti-TNF / anti-IL monotherapy explicitly NOT severe for COVID (handled via per-therapy covidSevere flags).
  let covidNote = covidSevereFlag
    ? "Severe IC: 2 primary doses + consider 3rd. Further doses every 12mo (consider 6-monthly). Reduced immunogenicity."
    : "Single primary dose; consider further dose every 12mo. Anti-TNF/anti-IL monotherapy is not 'severe' for COVID dosing.";
  if (covidNotes.length) covidNote += " " + covidNotes.join(" ");
  V.push({ name: "COVID-19", type: "Non-live", schedule: covidSevereFlag ? "2 primary doses + consider 3rd; then \u226512-monthly (consider 6-monthly)" : "Single primary dose; consider 12-monthly", ci: false, nip: true, nipNote: "NIP-funded. Per current ATAGI seasonal guidance.", notes: covidNote, priority: covidSevereFlag ? "essential" : "recommended", status: kn("covid_uptodate") ? "done" : "due", statusNote: kn("covid_uptodate") ? "Up to date" : "Check current ATAGI advice" });

  const mNIP = needsE || hasHSCT || hasHIV;
  const mA = kn("menACWY"), mB = kn("menB");
  let mSt = "due", mN = "";
  if (mNIP || needsE) {
    if (mA && mB) { mSt = "done"; mN = "Both done \u2014 check booster schedule"; }
    else if (mA || mB) { mSt = "partial"; mN = `${mA ? "ACWY" : "B"} done \u2014 ${mA ? "B" : "ACWY"} due`; }
    else { mSt = "due"; mN = "Both ACWY + B required"; }
  } else { mSt = mA && mB ? "done" : "consider"; mN = "Not routinely indicated"; }
  V.push({ name: "Meningococcal ACWY + B", type: "Non-live", schedule: needsE ? "ACWY: 2 doses 8wk + 5yr boosters. B: 2 doses \u22652mo + boosters" : "Per risk \u2014 Handbook", ci: false, nip: mNIP, nipNote: mNIP ? "NIP-funded asplenia/complement/HSCT" : "Not NIP-funded", notes: has("eculizumab") ? "CRITICAL \u2014 vaccinate \u22652wk pre-therapy. Abx prophylaxis." : (needsE ? "HIGH PRIORITY" : ""), priority: needsE ? "essential" : (mNIP ? "recommended" : "consider"), status: mSt, statusNote: mN });

  if (needsE || hasHSCT) {
    V.push({ name: "Hib", type: "Non-live", schedule: hasHSCT ? "3 doses post-transplant" : "Single dose if incomplete", ci: false, nip: has("asplenia") || hasHSCT, nipNote: (has("asplenia") || hasHSCT) ? "NIP-funded" : "Not funded", notes: "For asplenia/HSCT", priority: "essential", status: kn("hib") ? "done" : "due", statusNote: kn("hib") ? "Received" : "Due" });
  }

  V.push({ name: "HPV (Gardasil 9)", type: "Non-live", schedule: "3 doses (0, 2, 6mo)", ci: false, nip: age <= 25, nipNote: age <= 25 ? "NIP catch-up to 25yo" : "Private >25yo", notes: "3-dose for IC patients", priority: "recommended", status: kn("hpv_complete") ? "done" : "due", statusNote: kn("hpv_complete") ? "Course complete" : "Check AIR" });

  // RSV — age-dependent recommendations (NIP funding from 15 May 2026: Arexvy for ≥75 and ATSI ≥60)
  const rsvDone = kn("rsv");
  const rsvATSI60 = atsi && age >= 60;
  if (age >= 75) {
    V.push({ name: "RSV (Arexvy)", type: "Non-live", schedule: "Single dose. Ideally pre-RSV season (autumn).", ci: false, nip: true, nipNote: "NIP-funded from 15 May 2026 (Arexvy only). Single dose, not annual. \u22652 seasons protection.", notes: "Recommended for all \u226575yo. Non-live protein-subunit \u2014 safe on IS. Can co-administer with flu/COVID/zoster/pneumococcal. Rare GBS signal \u2014 discuss.", priority: "recommended", status: rsvDone ? "done" : "due", statusNote: rsvDone ? "Received" : "Due \u2014 NIP-funded \u226575yo" });
  } else if (rsvATSI60) {
    V.push({ name: "RSV (Arexvy)", type: "Non-live", schedule: "Single dose. Ideally pre-RSV season (autumn).", ci: false, nip: true, nipNote: "NIP-funded from 15 May 2026 for ATSI \u226560yo (Arexvy only). Single dose, not annual.", notes: "Recommended for ATSI \u226560yo. Non-live \u2014 safe on IS. Can co-administer with flu/COVID/zoster/pneumococcal. Rare GBS signal \u2014 discuss.", priority: "recommended", status: rsvDone ? "done" : "due", statusNote: rsvDone ? "Received" : "Due \u2014 NIP-funded ATSI \u226560yo" });
  } else if (age >= 60 && modSev) {
    V.push({ name: "RSV (Arexvy or Abrysvo)", type: "Non-live", schedule: "Single dose. Ideally pre-RSV season.", ci: false, nip: false, nipNote: "Not NIP-funded for 60\u201374 non-ATSI. Arexvy ~$300 private. Abrysvo also registered \u226560.", notes: "Recommended for 60\u201374yo with IC risk conditions. Non-live \u2014 safe on IS. Rare GBS signal.", priority: "recommended", status: rsvDone ? "done" : "due", statusNote: rsvDone ? "Received" : "Due \u2014 recommended (IC + \u226560yo) but not NIP-funded" });
  } else if (age >= 60) {
    V.push({ name: "RSV (Arexvy or Abrysvo)", type: "Non-live", schedule: "Single dose. Ideally pre-RSV season.", ci: false, nip: false, nipNote: "Not NIP-funded for 60\u201374 non-ATSI without risk conditions.", notes: "Can consider for 60\u201374yo. Lower benefit than \u226575yo. Rare GBS signal.", priority: "consider", status: rsvDone ? "done" : "consider", statusNote: rsvDone ? "Received" : "Can consider \u2014 not NIP-funded" });
  } else if (age >= 50 && modSev) {
    V.push({ name: "RSV (Arexvy only)", type: "Non-live", schedule: "Single dose. Ideally pre-RSV season.", ci: false, nip: false, nipNote: "Not NIP-funded. Private script ~$300.", notes: "Can consider for 50\u201359yo with IC risk conditions. Arexvy only (Abrysvo not registered 50\u201359). Non-live \u2014 safe on IS.", priority: "consider", status: rsvDone ? "done" : "consider", statusNote: rsvDone ? "Received" : "Can consider \u2014 Arexvy only, private script" });
  }
  // <50yo: RSV not registered, not shown

  const mmrOk = kn("mmr2");
  V.push({ name: "MMR", type: "LIVE", schedule: modSev ? "CONTRAINDICATED on therapy" : "2 doses if non-immune", ci: modSev && !mmrOk, nip: false, nipNote: "Some state catch-up funding", notes: modSev ? (mmrOk ? "Immune \u2014 no action" : "Check measles/rubella serology \u2192 cocoon if non-immune \u2192 vaccinate post-washout") : "Can give in mild IC \u2014 specialist assessment", priority: mmrOk ? "done_live" : (modSev ? "check_serology" : "recommended"), status: mmrOk ? "done" : (modSev ? "contraindicated" : "due"), statusNote: mmrOk ? "Immune" : (modSev ? "CI \u2014 check serology, cocoon contacts" : "Check serology, give if non-immune") });

  const vzOk = kn("varicella2");
  V.push({ name: "Varicella", type: "LIVE", schedule: modSev ? "CONTRAINDICATED on therapy" : "2 doses if non-immune", ci: modSev && !vzOk, nip: false, nipNote: "Not NIP-funded for adults", notes: modSev ? (vzOk ? "Immune \u2014 no action" : "Check VZV IgG \u2192 cocoon \u2192 vaccinate post-washout") : "Can give in mild IC \u2014 specialist assessment", priority: vzOk ? "done_live" : (modSev ? "check_serology" : "recommended"), status: vzOk ? "done" : (modSev ? "contraindicated" : "due"), statusNote: vzOk ? "Immune" : (modSev ? "CI \u2014 check VZV IgG, cocoon contacts" : "Check VZV IgG, give if non-immune") });

  return V;
}

// PJP PROPHYLAXIS LOGIC
// ═══════════════════════════════════════════════════════════════════════════════
function getPJP(therapies, level) {
  const has = t => therapies.includes(t);
  const modSev = LEVEL_ORDER[level] >= 2;

  // Count immunosuppressive agents for combination risk
  const isAgents = [];
  for (const cat of Object.values(THERAPY_CATEGORIES))
    for (const [k, th] of Object.entries(cat.therapies))
      if (therapies.includes(k) && LEVEL_ORDER[th.level] >= 1) isAgents.push(k);

  const hasCorticoMod = has("predMod") || has("predHigh") || has("predPulse");
  const hasCorticoHigh = has("predHigh") || has("predPulse");
  const hasAntiTNF = has("antiTNF_monoclonal") || has("etanercept");
  const hasRituximab = has("rituximab");
  const hasAlemtuzumab = has("alemtuzumab");
  const hasCyclophosphamide = has("cyclophosphamide");
  const hasSOT = has("sot");
  const hasHSCT = has("hsct");
  const hasHIVsevere = has("hivSevere");
  const hasHIVmod = has("hivModerate");
  const hasHaemActive = has("haemMalignActive");
  const hasJAK = has("jakInhibitor");
  const hasCNI = has("calcineurin");
  const hasMTOR = has("mtorInhibitor");
  const hasMMFhigh = has("mmfHigh");

  // Triple IS: biologic/conventional + thiopurine/MMF + steroid
  const hasConventionalIS = has("azaLow") || has("azaHigh") || has("mercaptoLow") || has("mercaptoHigh") || has("mmfLow") || has("mmfHigh") || has("mtxLow") || has("mtxHigh");
  const hasBiologic = hasAntiTNF || has("antiIL6") || has("abatacept") || has("natalizumab") || has("belimumab") || hasRituximab;
  const tripleIS = (hasBiologic || hasConventionalIS) && hasCorticoMod && isAgents.length >= 3;

  let indication = "not_indicated"; // not_indicated, consider, indicated
  let reasons = [];
  let duration = "";
  let notes = [];

  // ── INDICATED ──
  if (hasAlemtuzumab) {
    indication = "indicated";
    reasons.push("Alemtuzumab \u2014 profound T-cell depletion");
    duration = "\u22656 months post-treatment or until CD4 >200 for \u22653 months";
  }
  if (hasCyclophosphamide && hasCorticoMod) {
    indication = "indicated";
    reasons.push("Cyclophosphamide + corticosteroids");
    duration = "For duration of therapy + \u22651 month after cessation";
  }
  if (hasCyclophosphamide && !hasCorticoMod) {
    if (indication !== "indicated") { indication = "indicated"; }
    reasons.push("Cyclophosphamide");
    duration = duration || "For duration of therapy + \u22651 month after cessation";
  }
  if (hasRituximab && hasCorticoMod) {
    indication = "indicated";
    reasons.push("Rituximab + corticosteroids \u2014 combined B-cell and T-cell suppression");
    duration = duration || "For duration of therapy. Consider until B-cell recovery + steroid cessation.";
  }
  if (hasCorticoHigh) {
    indication = "indicated";
    reasons.push("Prednisolone \u226520 mg/day \u2014 high-dose corticosteroid");
    duration = duration || "For duration of high-dose therapy. Review when dose <10 mg/day.";
  }
  if (has("predPulse")) {
    indication = "indicated";
    reasons.push("Pulse IV methylprednisolone");
    duration = duration || "During and after pulse therapy until maintenance dose <10 mg/day";
  }
  if (hasSOT) {
    indication = "indicated";
    reasons.push("Solid organ transplant");
    duration = duration || "\u22656\u201312 months post-transplant. Many centres continue lifelong if on \u22652 IS agents.";
  }
  if (hasHSCT) {
    indication = "indicated";
    reasons.push("HSCT");
    duration = duration || "\u22656 months post-transplant. Continue if ongoing IS or GvHD.";
  }
  if (hasHIVsevere) {
    indication = "indicated";
    reasons.push("HIV with CD4 <100");
    duration = duration || "Until CD4 >200 for \u22653 months on ART";
  }
  if (hasHIVmod) {
    indication = "indicated";
    reasons.push("HIV with CD4 100\u2013199");
    duration = duration || "Until CD4 >200 for \u22653 months on ART";
  }
  if (hasHaemActive) {
    indication = "indicated";
    reasons.push("Active haematological malignancy on treatment");
    duration = duration || "For duration of chemotherapy + until immune reconstitution. Specialist-directed.";
    notes.push("Particularly important with ALL, lymphoma (esp. purine analogues), or corticosteroid-containing regimens.");
  }
  if (tripleIS) {
    indication = "indicated";
    reasons.push("Triple immunosuppression (\u22653 agents including corticosteroid)");
    duration = duration || "For duration of combination therapy. Review on de-escalation.";
  }

  // ── CONSIDER ──
  if (indication !== "indicated") {
    if (has("predMod")) {
      indication = "consider";
      reasons.push("Prednisolone 10\u201320 mg/day for >4 weeks \u2014 moderate-dose steroid");
      duration = "Consider while on \u226510 mg/day";
      notes.push("Risk increases with dose and duration. Some guidelines use \u226520 mg as threshold; others \u226516 mg for \u22658 weeks.");
    }
    if (hasRituximab && !hasCorticoMod) {
      indication = "consider";
      reasons.push("Rituximab monotherapy \u2014 B-cell depletion increases PJP risk especially if prior steroid exposure");
      duration = duration || "Consider for 6\u201312 months post-infusion or until B-cell recovery";
    }
    if (hasJAK) {
      indication = "consider";
      reasons.push("JAK inhibitor \u2014 case reports of PJP, particularly tofacitinib");
      duration = duration || "Consider if combined with other IS or corticosteroids";
      notes.push("No formal guideline recommendation. Risk increases in combination regimens.");
    }
    if (hasAntiTNF && hasConventionalIS && !hasCorticoMod) {
      indication = "consider";
      reasons.push("Anti-TNF + conventional IS (dual therapy without steroid)");
      duration = duration || "Consider while on combination therapy";
    }
    if (hasCNI && !hasSOT) {
      indication = "consider";
      reasons.push("Calcineurin inhibitor outside transplant context");
      duration = duration || "Consider if combined with other IS";
    }
    if (hasMTOR && !hasSOT) {
      indication = "consider";
      reasons.push("mTOR inhibitor \u2014 case reports of PJP");
      duration = duration || "Consider if combined with other IS";
    }
    if (hasMMFhigh && isAgents.length >= 2 && !hasCorticoMod) {
      indication = "consider";
      reasons.push("High-dose mycophenolate + other IS");
      duration = duration || "Consider while on combination therapy";
    }
  }

  if (indication === "not_indicated" && isAgents.length > 0) {
    notes.push("Low PJP risk with current therapy. Reassess if regimen escalated or corticosteroids added.");
  }

  return { indication, reasons, duration, notes };
}

// PRINT
// ═══════════════════════════════════════════════════════════════════════════════
function handlePrint(vaccines, details, level, combo, pjp) {
  const pw = window.open('', '_blank');
  const today = new Date().toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
  const row = v => `<tr style="background:${v.status==='contraindicated'?'#fef2f2':v.status==='done'?'#f0fdf4':'transparent'}">
    <td style="padding:4px 6px;border:1px solid #d1d5db;font-weight:600">${v.name}${v.ci?` <span style="color:#dc2626">\u2715</span>`:''}</td>
    <td style="padding:4px 6px;border:1px solid #d1d5db;color:${v.type==='LIVE'?'#dc2626':'#16a34a'};font-weight:700;font-size:10px">${v.type}</td>
    <td style="padding:4px 6px;border:1px solid #d1d5db;font-weight:600;color:${v.status==='done'?'#16a34a':v.status==='contraindicated'?'#dc2626':v.status==='partial'||v.status==='action'?'#d97706':'#1e40af'}">${v.statusNote}</td>
    <td style="padding:4px 6px;border:1px solid #d1d5db">${v.schedule}</td>
    <td style="padding:4px 6px;border:1px solid #d1d5db">${v.nip?'<b style="color:#16a34a">Yes</b>':'No'}${v.nipNote?'<br><span style="font-size:9px;color:#6b7280">'+v.nipNote+'</span>':''}</td>
    <td style="padding:4px 6px;border:1px solid #d1d5db;font-size:10px">${v.notes}</td></tr>`;
  const tbl = list => list.length===0?'':`<table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:8px"><thead><tr style="background:#e2e8f0"><th style="padding:4px 6px;border:1px solid #d1d5db;text-align:left;font-size:10px">Vaccine</th><th style="padding:4px 6px;border:1px solid #d1d5db;text-align:left;font-size:10px;width:45px">Type</th><th style="padding:4px 6px;border:1px solid #d1d5db;text-align:left;font-size:10px">Status</th><th style="padding:4px 6px;border:1px solid #d1d5db;text-align:left;font-size:10px">Schedule</th><th style="padding:4px 6px;border:1px solid #d1d5db;text-align:left;font-size:10px;width:14%">NIP</th><th style="padding:4px 6px;border:1px solid #d1d5db;text-align:left;font-size:10px">Notes</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table>`;
  const noWO = ["N/A","Not applicable","Not applicable \u2014 not immunosuppressive"];
  const wo = details.filter(d => d.washout && !noWO.includes(d.washout)).map(d => `<tr><td style="padding:3px 6px;border:1px solid #d1d5db">${d.label}</td><td style="padding:3px 6px;border:1px solid #d1d5db">${d.washout}</td></tr>`).join('');
  const action = vaccines.filter(v => v.status !== "done" && v.status !== "consider");
  const done = vaccines.filter(v => v.status === "done");
  pw.document.write(`<!DOCTYPE html><html><head><title>Vaccination Plan</title></head><body style="font-family:'Segoe UI',system-ui,sans-serif;max-width:210mm;margin:0 auto;padding:10mm 14mm;font-size:11px;color:#1f2937">
    <div style="display:flex;justify-content:space-between;border-bottom:3px solid #1e3a5f;padding-bottom:6px;margin-bottom:10px"><div><h1 style="margin:0;font-size:16px;color:#1e3a5f">Vaccination Recommendations \u2014 Immunocompromised Patient</h1><p style="margin:2px 0 0;font-size:10px;color:#6b7280">Clinical decision support \u2014 Australian Immunisation Handbook (ATAGI)</p></div><div style="text-align:right;font-size:9px;color:#6b7280">Generated: ${today}<br>Handbook: ATAGI (current); 21vPCV program 1 Jul 2026</div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px"><div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:4px;padding:6px"><div style="font-size:9px;text-transform:uppercase;color:#64748b;margin-bottom:2px">Patient</div>${state.initials ? '<b style="font-size:14px">' + state.initials + '</b> &mdash; ' : ''}Age: <b>${state.age}</b> | ATSI: <b>${state.atsi?'Yes':'No'}</b> | <b>${state.timing==='pre_treatment'?'Pre-treatment':state.timing==='on_treatment'?'On treatment':'Recently ceased'}</b></div>
    <div style="background:${level==='severe'?'#fef2f2':level==='moderate'?'#fffbeb':'#eff6ff'};border:1px solid ${LEVEL_BORDER[level]};border-radius:4px;padding:6px"><div style="font-size:9px;text-transform:uppercase;color:#64748b;margin-bottom:2px">Immunocompromise</div><div style="font-weight:700;color:${LEVEL_COLORS[level]};font-size:14px">${LEVEL_LABELS[level]}</div></div></div>
    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:4px;padding:6px;margin-bottom:8px"><div style="font-size:9px;text-transform:uppercase;color:#64748b;margin-bottom:3px">Therapies</div>${details.map(d=>`<div>\u2022 ${d.label} <span style="color:${LEVEL_COLORS[d.level]};font-weight:600;font-size:9px">[${LEVEL_LABELS[d.level]}]</span></div>`).join('')}</div>
    ${combo?`<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:4px;padding:6px;margin-bottom:8px;font-size:10px;color:#991b1b"><b>\u26A0</b> ${combo}</div>`:''}
    ${action.length>0?'<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#1e40af;margin-bottom:4px">Action Required</div>'+tbl(action):''}
    ${done.length>0?'<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#16a34a;margin-bottom:4px">Completed</div>'+tbl(done):''}
    ${wo?`<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#64748b;margin-bottom:3px">Washout Periods</div><table style="width:55%;border-collapse:collapse;font-size:10px"><thead><tr style="background:#f3f4f6"><th style="padding:3px 6px;border:1px solid #d1d5db;text-align:left">Therapy</th><th style="padding:3px 6px;border:1px solid #d1d5db;text-align:left">Washout</th></tr></thead><tbody>${wo}</tbody></table>`:''}
    ${pjp.indication !== 'not_indicated' ? `<div style="background:${pjp.indication==='indicated'?'#fef2f2':'#fffbeb'};border:1px solid ${pjp.indication==='indicated'?'#fecaca':'#fde68a'};border-radius:4px;padding:8px;margin:8px 0;font-size:10px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:${pjp.indication==='indicated'?'#991b1b':'#92400e'};margin-bottom:4px">\uD83D\uDEE1\uFE0F PJP Prophylaxis \u2014 ${pjp.indication==='indicated'?'INDICATED':'CONSIDER'}</div>
      <div style="margin-bottom:4px">${pjp.reasons.map(r => '<div>\u2022 ' + r + '</div>').join('')}</div>
      ${pjp.duration ? '<div style="margin-bottom:4px"><b>Duration:</b> ' + pjp.duration + '</div>' : ''}
      <div><b>First-line:</b> TMP-SMX 160/800mg (DS) daily or Mon/Wed/Fri</div>
      <div><b>Alternatives:</b> Dapsone 100mg daily (check G6PD) | Atovaquone 1500mg daily | Nebulised pentamidine 300mg monthly</div>
      ${pjp.notes.length ? '<div style="margin-top:3px;color:#6b7280;font-style:italic">' + pjp.notes.join(' ') + '</div>' : ''}
    </div>` : ''}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0"><div style="padding:6px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:4px;font-size:10px"><b>Serology:</b> VZV IgG, measles IgG, rubella IgG, anti-HBs (\u00b1 HBsAg/anti-HBc). Pneumococcal hx on AIR.</div><div style="padding:6px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:4px;font-size:10px"><b>Contacts:</b> MMR, varicella, annual influenza up to date. Live vaccines safe for contacts.</div></div>
    <div style="border-top:1px solid #d1d5db;padding-top:6px;font-size:8px;color:#9ca3af"><b>Disclaimer:</b> Clinical decision support for specialist physicians. Australian Immunisation Handbook (ATAGI, current). Does not replace clinical judgement. Verify NIP at vaccination. HSCT \u2192 specialist revaccination protocol.</div></body></html>`);
  pw.document.close();
  pw.print();
}

// ═══════════════════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════════════════
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function dotClass(s) { return s==='done'?'dot-done':s==='partial'?'dot-partial':s==='contraindicated'||s==='action'?'dot-ci':s==='consider'?'dot-consider':'dot-due'; }

function render() {
  const { level, indiv, combo, details } = calcLevel();
  const vaccines = state.therapies.length > 0 ? getVaccines(level, state.age, state.atsi, state.therapies, state.known) : [];
  const action = vaccines.filter(v => v.status !== "done" && v.status !== "consider");
  const done = vaccines.filter(v => v.status === "done");
  const consider = vaccines.filter(v => v.status === "consider");
  const cnt = state.therapies.length;
  const kvCnt = state.known.length;
  const noWO = ["N/A","Not applicable","Not applicable \u2014 not immunosuppressive"];
  const washouts = details.filter(d => d.washout && !noWO.includes(d.washout));

  let h = '';

  // Header
  h += `<div class="hdr"><div><h1>Australian IC Vaccination Calculator</h1><div class="hdr-sub">Australian Immunisation Handbook \u2014 ATAGI (current)</div></div><button class="btn-reset" onclick="resetAll()">\u27F3 Reset All</button></div>`;
  h += `<div class="body-wrap">`;

  // Demographics
  h += `<div class="sec sec-line"><div class="sec-title">Patient</div><div class="row">`;
  h += `<div><div class="lbl">Age</div><input type="number" id="age-input" value="${state.age}" min="18" max="110"></div>`;
  h += `<div><div class="lbl">Patient Initials</div><input type="text" id="initials-input" value="${esc(state.initials)}" maxlength="10" placeholder="e.g. JDS" style="padding:5px 8px;border:1px solid #cbd5e1;border-radius:5px;font-size:13px;width:80px;background:#fff;font-family:inherit;text-transform:uppercase"></div>`;
  h += `<div><div class="lbl">ATSI</div><div class="radio-group"><label><input type="radio" name="atsi" value="no" ${!state.atsi?'checked':''}> No</label><label><input type="radio" name="atsi" value="yes" ${state.atsi?'checked':''}> Yes</label></div></div>`;
  h += `<div><div class="lbl">Timing</div><select id="timing-select"><option value="pre_treatment" ${state.timing==='pre_treatment'?'selected':''}>Pre-treatment</option><option value="on_treatment" ${state.timing==='on_treatment'?'selected':''}>On treatment</option><option value="recently_ceased" ${state.timing==='recently_ceased'?'selected':''}>Recently ceased</option></select></div>`;
  h += `</div>`;
  if (state.timing === "pre_treatment") h += `<div class="alert-pretreat"><b>Pre-treatment:</b> Live \u22654wk and non-live \u22652wk before IS.</div>`;
  if (state.timing === "recently_ceased") h += `<div class="alert-ceased"><b>Post-cessation:</b> Live vaccines after washout \u2014 see intervals.</div>`;
  h += `</div>`;

  // Therapies
  h += `<div class="sec sec-line"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><div class="sec-title">Therapies & Conditions ${cnt>0?`<span class="cnt">${cnt}</span>`:''}</div>${cnt>0?'<button class="btn-clear" onclick="clearTherapies()">Clear therapies</button>':''}</div>`;
  h += `<div class="th-list">`;
  for (const [ck, cat] of Object.entries(THERAPY_CATEGORIES)) {
    const catSel = Object.keys(cat.therapies).filter(t => state.therapies.includes(t));
    h += `<div><div class="cat-hdr" onclick="toggleCat('${ck}')"><span class="cat-title">${state.expCat[ck]?'\u25BE':'\u25B8'} ${esc(cat.label)}${catSel.length>0?`<span class="cnt">${catSel.length}</span>`:''}</span></div>`;
    if (state.expCat[ck]) {
      h += `<div>`;
      for (const [tk, th] of Object.entries(cat.therapies)) {
        const sel = state.therapies.includes(tk);
        h += `<div class="th-item${sel?' sel':''}" onclick="toggleTherapy('${tk}')"><input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation();toggleTherapy('${tk}')"><span class="th-label">${esc(th.label)}</span><span class="badge badge-${th.level}">${LEVEL_LABELS[th.level]}</span></div>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
  }
  h += `</div></div>`;

  // Known Vaccines
  h += `<div class="sec sec-line"><div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleKVPanel()"><div class="sec-title">${state.showKV?'\u25BE':'\u25B8'} Known Vaccines / Immunity ${kvCnt>0?`<span class="cnt cnt-green">${kvCnt}</span>`:''}</div>${kvCnt>0?`<button class="btn-clear" onclick="event.stopPropagation();clearKnown()">Clear vaccines</button>`:''}</div>`;
  if (state.showKV) {
    h += `<div class="kv-grid">`;
    for (const v of KNOWN_VACCINES) {
      const sel = state.known.includes(v.id);
      h += `<div class="kv-item${sel?' sel':''}" onclick="toggleKV('${v.id}')"><input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation();toggleKV('${v.id}')"><span>${esc(v.label)}</span>${v.group==='Live'?'<span class="kv-live">LIVE</span>':''}</div>`;
    }
    h += `</div>`;
  } else if (kvCnt > 0) {
    h += `<div class="kv-summary">${state.known.map(k => { const v = KNOWN_VACCINES.find(x=>x.id===k); return v ? esc(v.label) : ''; }).filter(Boolean).join(' \u00b7 ')}</div>`;
  }
  h += `</div>`;

  // Results
  if (cnt > 0) {
    h += `<div class="sec">`;
    // Level box
    h += `<div class="level-box" style="background:${LEVEL_BG[level]};border-color:${LEVEL_BORDER[level]}"><div><div class="overall-label">Overall</div><div class="overall-value" style="color:${LEVEL_COLORS[level]}">${LEVEL_LABELS[level]}</div></div><div class="indiv">${indiv.map(il => `<div><span style="color:${LEVEL_COLORS[il.level]};font-weight:600">${LEVEL_LABELS[il.level]}</span> \u2014 ${esc(il.name.split(' (')[0])}</div>`).join('')}</div></div>`;
    if (combo) h += `<div class="alert-box alert-combo"><b>\u26A0</b> ${esc(combo)}</div>`;
    details.filter(d => d.notes).forEach(d => { h += `<div class="alert-note"><b>${esc(d.label.split(' (')[0])}:</b> ${esc(d.notes)}</div>`; });
    if (state.timing === "recently_ceased" && washouts.length > 0) {
      h += `<div class="washout-box"><div class="lbl" style="margin-bottom:3px">Washout Periods</div>`;
      washouts.forEach(d => { h += `<div style="font-size:12px;padding:1px 0"><b>${esc(d.label.split(' (')[0])}:</b> ${esc(d.washout)}</div>`; });
      h += `</div>`;
    }

    // Action table
    if (action.length > 0) {
      h += `<div class="section-label section-label-action">Action Required (${action.length})</div>`;
      h += `<div style="overflow-x:auto;margin-bottom:8px"><table class="action-table"><thead><tr><th>Vaccine</th><th>Type</th><th>Status</th><th>Schedule</th><th>NIP</th><th>Notes</th></tr></thead><tbody>`;
      action.forEach(v => {
        h += `<tr class="${v.status==='contraindicated'||v.status==='action'?'row-ci':''}"><td class="v-name">${esc(v.name)}${v.ci?'<span class="ci-tag">\u2715 CONTRAINDICATED</span>':''}</td><td class="${v.type==='LIVE'?'type-live':'type-nonlive'}">${v.type}</td><td><span class="dot ${dotClass(v.status)}"></span><span class="v-status">${esc(v.statusNote)}</span></td><td class="v-schedule">${esc(v.schedule)}</td><td class="${v.nip?'nip-yes':'nip-no'}">${v.nip?'Yes':'No'}</td><td class="v-notes">${esc(v.notes)}</td></tr>`;
      });
      h += `</tbody></table></div>`;
    }

    // Done
    if (done.length > 0) {
      h += `<div class="section-label section-label-done">Completed (${done.length})</div>`;
      h += `<div style="margin-bottom:8px"><table class="done-table"><tbody>`;
      done.forEach(v => { h += `<tr><td class="v-name">${esc(v.name)}</td><td class="${v.type==='LIVE'?'type-live':'type-nonlive'}">${v.type}</td><td><span class="dot dot-done"></span>${esc(v.statusNote)}</td></tr>`; });
      h += `</tbody></table></div>`;
    }

    // Consider
    if (consider.length > 0) {
      h += `<div class="section-label section-label-consider">Consider (${consider.length})</div>`;
      h += `<div style="margin-bottom:8px"><table class="consider-table"><tbody>`;
      consider.forEach(v => { h += `<tr><td class="v-name">${esc(v.name)}</td><td style="font-size:10px;color:#64748b">${esc(v.statusNote)}</td></tr>`; });
      h += `</tbody></table></div>`;
    }

    // PJP Prophylaxis
    const pjp = getPJP(state.therapies, level);
    if (pjp.indication === "indicated") {
      h += `<div style="background:linear-gradient(135deg,#fef2f2,#fee2e2);border:2px solid #fecaca;border-radius:6px;padding:12px;margin:10px 0">`;
      h += `<div style="font-size:12px;font-weight:700;color:#991b1b;margin-bottom:6px">\uD83D\uDEE1\uFE0F PJP Prophylaxis \u2014 INDICATED</div>`;
      h += `<div style="font-size:12px;margin-bottom:6px">${pjp.reasons.map(r => '<div style="padding:1px 0">\u2022 ' + esc(r) + '</div>').join('')}</div>`;
      if (pjp.duration) h += `<div style="font-size:12px;margin-bottom:6px"><b>Duration:</b> ${esc(pjp.duration)}</div>`;
      h += `<div style="font-size:11px;background:#fff;border-radius:4px;padding:8px;border:1px solid #e2e8f0">`;
      h += `<div style="font-weight:700;margin-bottom:3px">Regimen Options</div>`;
      h += `<div><b>First-line:</b> TMP-SMX 160/800mg (DS) daily <i>or</i> Mon/Wed/Fri</div>`;
      h += `<div><b>Alternatives:</b> Dapsone 100mg daily (check G6PD) | Atovaquone 1500mg daily | Nebulised pentamidine 300mg monthly</div>`;
      h += `</div>`;
      if (pjp.notes.length) h += `<div style="font-size:11px;color:#6b7280;font-style:italic;margin-top:4px">${pjp.notes.map(n => esc(n)).join(' ')}</div>`;
      h += `</div>`;
    } else if (pjp.indication === "consider") {
      h += `<div style="background:linear-gradient(135deg,#fffbeb,#fef3c7);border:2px solid #fde68a;border-radius:6px;padding:12px;margin:10px 0">`;
      h += `<div style="font-size:12px;font-weight:700;color:#92400e;margin-bottom:6px">\uD83D\uDEE1\uFE0F PJP Prophylaxis \u2014 CONSIDER</div>`;
      h += `<div style="font-size:12px;margin-bottom:6px">${pjp.reasons.map(r => '<div style="padding:1px 0">\u2022 ' + esc(r) + '</div>').join('')}</div>`;
      if (pjp.duration) h += `<div style="font-size:12px;margin-bottom:6px"><b>Duration:</b> ${esc(pjp.duration)}</div>`;
      h += `<div style="font-size:11px;background:#fff;border-radius:4px;padding:8px;border:1px solid #e2e8f0">`;
      h += `<div style="font-weight:700;margin-bottom:3px">If initiating prophylaxis</div>`;
      h += `<div><b>First-line:</b> TMP-SMX 160/800mg (DS) daily <i>or</i> Mon/Wed/Fri</div>`;
      h += `<div><b>Alternatives:</b> Dapsone 100mg daily (check G6PD) | Atovaquone 1500mg daily | Nebulised pentamidine 300mg monthly</div>`;
      h += `</div>`;
      if (pjp.notes.length) h += `<div style="font-size:11px;color:#6b7280;font-style:italic;margin-top:4px">${pjp.notes.map(n => esc(n)).join(' ')}</div>`;
      h += `</div>`;
    } else if (state.therapies.length > 0 && pjp.notes.length > 0) {
      h += `<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:5px;padding:8px;margin:8px 0;font-size:11px;color:#64748b"><b>\uD83D\uDEE1\uFE0F PJP Prophylaxis:</b> ${pjp.notes.map(n => esc(n)).join(' ')}</div>`;
    }

    // Info
    h += `<div class="info-grid"><div class="info-sero"><b style="color:#166534">Serology:</b> VZV IgG, measles IgG, rubella IgG, anti-HBs (\u00b1 HBsAg/anti-HBc). Pneumococcal hx on AIR.</div><div class="info-contacts"><b style="color:#1e40af">Contacts:</b> MMR, varicella, annual influenza up to date. Live vaccines safe for contacts.</div></div>`;

    // Buttons
    h += `<div class="btn-row"><button class="btn-print" onclick="doPrint()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print Plan</button><button class="btn-reset" onclick="resetAll()">\u27F3 Reset All</button></div>`;
    h += `<div class="disclaimer"><b>Disclaimer:</b> Clinical decision support for specialist physicians. Australian Immunisation Handbook (ATAGI, current). Does not replace clinical judgement. Verify NIP at vaccination. HSCT \u2192 specialist revaccination.</div>`;
    h += `</div>`;
  } else {
    h += `<div class="empty"><div class="empty-icon">\uD83D\uDC89</div><div class="empty-text">Select therapies or conditions above</div><div class="empty-sub">Recommendations generated based on immunocompromise level</div></div>`;
  }

  h += `</div>`; // body-wrap
  document.getElementById('app').innerHTML = h;

  // Bind events
  const ageInput = document.getElementById('age-input');
  if (ageInput) ageInput.addEventListener('change', e => { state.age = parseInt(e.target.value) || 18; render(); });
  const initialsInput = document.getElementById('initials-input');
  if (initialsInput) initialsInput.addEventListener('input', e => { state.initials = e.target.value.toUpperCase(); });
  document.querySelectorAll('input[name="atsi"]').forEach(r => r.addEventListener('change', e => { state.atsi = e.target.value === 'yes'; render(); }));
  const timingSel = document.getElementById('timing-select');
  if (timingSel) timingSel.addEventListener('change', e => { state.timing = e.target.value; render(); });
}

// Global handlers
window.toggleTherapy = function(id) { state.therapies = tog(state.therapies, id); render(); };
window.toggleKV = function(id) { state.known = tog(state.known, id); render(); };
window.toggleCat = function(c) { state.expCat[c] = !state.expCat[c]; render(); };
window.toggleKVPanel = function() { state.showKV = !state.showKV; render(); };
window.clearTherapies = function() { state.therapies = []; render(); };
window.clearKnown = function() { state.known = []; render(); };
window.doPrint = function() {
  const { level, combo, details } = calcLevel();
  const vaccines = getVaccines(level, state.age, state.atsi, state.therapies, state.known);
  const pjp = getPJP(state.therapies, level);
  handlePrint(vaccines, details, level, combo, pjp);
};

// Initial render
render();
</script>
</body>
</html>
